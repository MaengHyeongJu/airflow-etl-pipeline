[project]
name = "library_scanner"
version = "0.1.0"
description = "성남도서관 신착도서 중 대출가능한 SF/추리 소설을 찾는 스캐너"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["library_scanner*"]
